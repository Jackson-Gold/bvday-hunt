<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1030" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dia dos Namorados Scavenger Hunt</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 29'%3E%3Cpath fill='%23ff7eb3' d='M23.6 0c-3.4 0-6.3 2.18-7.6 5.05C14.7 2.18 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.42 9.48 11.9 16 21.2 6.13-9.32 16-12 16-21.2C32 3.8 28.2 0 23.6 0z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="is-locked">
  <!-- starfield background -->
  <div class="stars" aria-hidden="true">
    <div class="stars__layer stars__layer--1"></div>
    <div class="stars__layer stars__layer--2"></div>
    <div class="stars__layer stars__layer--3"></div>
  </div>

  <!-- floating hearts background -->
  <div class="hearts" aria-hidden="true"></div>

  <!-- =====================================================================
       LOCK SCREEN — master gate
       ===================================================================== -->
  <section id="gate" class="gate" aria-label="Locked entrance">
    <div class="gate__inner">
      <div class="gate__sigil" aria-hidden="true">
        <svg viewBox="0 0 32 29" width="84" height="76">
          <defs>
            <radialGradient id="g" cx="50%" cy="38%" r="65%">
              <stop offset="0%" stop-color="#ffd1e1" />
              <stop offset="55%" stop-color="#ff7eb3" />
              <stop offset="100%" stop-color="#5a2a55" />
            </radialGradient>
          </defs>
          <path d="M23.6 0c-3.4 0-6.3 2.18-7.6 5.05C14.7 2.18 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.42 9.48 11.9 16 21.2 6.13-9.32 16-12 16-21.2C32 3.8 28.2 0 23.6 0z" fill="url(#g)" />
        </svg>
      </div>
      <h1 class="gate__title" data-title>Dia dos Namorados Scavenger Hunt</h1>
      <p class="gate__subtitle" data-subtitle>for the one I love</p>
      <p class="gate__greeting" data-greeting></p>
      <form id="gate-form" class="gate__form" autocomplete="off" novalidate>
        <label class="sr-only" for="gate-input">Password</label>
        <input
          id="gate-input"
          name="password"
          type="password"
          class="gate__input"
          inputmode="text"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <button type="submit" class="gate__btn">Enter</button>
      </form>
      <p id="gate-error" class="gate__error" role="alert" aria-live="polite"></p>
    </div>
  </section>

  <!-- =====================================================================
       COUNTDOWN OVERLAY — floats over the landing page until the hunt begins
       ===================================================================== -->
  <section id="countdown" class="countdown" hidden aria-label="Countdown to the hunt">
    <div class="countdown__inner">
      <div class="countdown__sigil" aria-hidden="true">
        <svg viewBox="0 0 32 29" width="64" height="58">
          <defs>
            <radialGradient id="cg" cx="50%" cy="38%" r="65%">
              <stop offset="0%" stop-color="#ffd1e1" />
              <stop offset="55%" stop-color="#ff7eb3" />
              <stop offset="100%" stop-color="#5a2a55" />
            </radialGradient>
          </defs>
          <path d="M23.6 0c-3.4 0-6.3 2.18-7.6 5.05C14.7 2.18 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.42 9.48 11.9 16 21.2 6.13-9.32 16-12 16-21.2C32 3.8 28.2 0 23.6 0z" fill="url(#cg)" />
        </svg>
      </div>

      <p class="countdown__message" id="countdown-message"></p>

      <p class="countdown__eyebrow" id="countdown-eyebrow"></p>
      <div class="countdown__clock" id="countdown-clock" role="timer" aria-live="off">
        <div class="countdown__unit">
          <span class="countdown__value" id="cd-days">00</span>
          <span class="countdown__label">days</span>
        </div>
        <span class="countdown__sep" aria-hidden="true">:</span>
        <div class="countdown__unit">
          <span class="countdown__value" id="cd-hours">00</span>
          <span class="countdown__label">hours</span>
        </div>
        <span class="countdown__sep" aria-hidden="true">:</span>
        <div class="countdown__unit">
          <span class="countdown__value" id="cd-mins">00</span>
          <span class="countdown__label">min</span>
        </div>
        <span class="countdown__sep" aria-hidden="true">:</span>
        <div class="countdown__unit">
          <span class="countdown__value" id="cd-secs">00</span>
          <span class="countdown__label">sec</span>
        </div>
      </div>

      <p class="countdown__ready" id="countdown-ready" hidden></p>
    </div>
  </section>

  <!-- =====================================================================
       HUNT APP — shown once gate is unlocked
       ===================================================================== -->
  <main id="app" class="app" hidden>
    <header class="app__header">
      <div class="brand">
        <span class="brand__heart" aria-hidden="true">♡</span>
        <div>
          <h1 class="brand__title" data-title>Dia dos Namorados Scavenger Hunt</h1>
          <p class="brand__subtitle" data-subtitle>for the one I love</p>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab is-active" role="tab" data-tab="start" aria-selected="true">Start Here</button>
        <button class="tab" role="tab" data-tab="hunt" aria-selected="false">The Hunt</button>
        <button class="tab" role="tab" data-tab="map" aria-selected="false">Map</button>
        <button class="tab" role="tab" data-tab="vault" aria-selected="false">Entertainment</button>
      </nav>
      <button id="reset-btn" class="ghost-btn" type="button" title="Reset progress">reset</button>
    </header>

    <!-- ============== TAB: START HERE / INSTRUCTIONS ============== -->
    <section id="tab-start" class="tab-panel is-active" role="tabpanel">
      <div class="howto" id="howto" aria-live="polite">
        <!-- populated by JS -->
      </div>
    </section>

    <!-- ============== TAB: THE HUNT ============== -->
    <section id="tab-hunt" class="tab-panel" role="tabpanel" hidden>
      <div class="stage-card" id="stage-card" aria-live="polite">
        <!-- populated by JS -->
      </div>

      <!-- per-stage reveal log -->
      <div class="reveals" id="reveals" aria-live="polite"></div>
    </section>

    <!-- ============== TAB: MAP / ROADMAP ============== -->
    <section id="tab-map" class="tab-panel" role="tabpanel" hidden>
      <h2 class="section-title">The Road So Far</h2>
      <p class="section-sub">Six whispers between us. Find each one to find me.</p>
      <ol id="roadmap" class="roadmap"></ol>
      <div class="progress">
        <div class="progress__bar"><div id="progress-fill" class="progress__fill"></div></div>
        <p class="progress__label"><span id="progress-count">0</span> of <span id="progress-total">6</span> hearts found</p>
      </div>
    </section>

    <!-- ============== TAB: ENTERTAINMENT VAULT ============== -->
    <section id="tab-vault" class="tab-panel" role="tabpanel" hidden>
      <h2 class="section-title">The Vault</h2>
      <p class="section-sub" id="vault-intro"></p>

      <div id="vault-content" class="vault"></div>
    </section>

    <footer class="app__footer">
      <span aria-hidden="true">♡</span>
      <span>made with love</span>
      <span aria-hidden="true">♡</span>
    </footer>
  </main>

  <!-- =====================================================================
       VICTORY OVERLAY — shown when stage 6 is solved
       ===================================================================== -->
  <section id="victory" class="victory" hidden aria-label="You found me">
    <div class="victory__inner">
      <div class="victory__sigil" aria-hidden="true">
        <svg viewBox="0 0 32 29" width="140" height="127">
          <defs>
            <radialGradient id="vg" cx="50%" cy="38%" r="65%">
              <stop offset="0%" stop-color="#fff1f7" />
              <stop offset="50%" stop-color="#ff7eb3" />
              <stop offset="100%" stop-color="#8a3a7a" />
            </radialGradient>
          </defs>
          <path d="M23.6 0c-3.4 0-6.3 2.18-7.6 5.05C14.7 2.18 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.42 9.48 11.9 16 21.2 6.13-9.32 16-12 16-21.2C32 3.8 28.2 0 23.6 0z" fill="url(#vg)" />
        </svg>
      </div>
      <h1 class="victory__title" id="victory-title"></h1>
      <p class="victory__message" id="victory-message"></p>
      <p class="victory__signature" id="victory-signature"></p>
      <div id="victory-media" class="victory__media"></div>
      <button type="button" class="ghost-btn" id="victory-close">return to the hunt</button>
    </div>
    <div class="victory__confetti" aria-hidden="true"></div>
  </section>

  <!-- scripts -->
  <script src="assets/js/content.js"></script>
  <script src="assets/js/clues.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
